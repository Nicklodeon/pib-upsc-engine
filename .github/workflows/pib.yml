name: PIB UPSC Daily Pipeline

on:
  schedule:
    # 10:00 PM IST = 4:30 PM UTC
    - cron: "30 16 * * *"

  workflow_dispatch:

jobs:
  pib-pipeline:

    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # CHECKOUT
      # ===================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ===================================================
      # PYTHON
      # ===================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ===================================================
      # DEPENDENCIES
      # ===================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ===================================================
      # VERIFY GROQ CONFIGURATION
      # ===================================================

      - name: Verify Groq API
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: |

          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY GitHub secret is missing."
            exit 1
          fi

          if [ -z "$GROQ_MODEL" ]; then
            echo "ERROR: GROQ_MODEL GitHub secret is missing."
            exit 1
          fi

          echo "Groq model configured as:"
          echo "$GROQ_MODEL"

          echo "Testing Groq API..."

          python - <<'PY'
          import os
          import requests

          api_key = os.environ["GROQ_API_KEY"]
          model = os.environ["GROQ_MODEL"]

          url = "https://api.groq.com/openai/v1/models"

          response = requests.get(
              url,
              headers={
                  "Authorization": f"Bearer {api_key}"
              },
              timeout=30,
          )

          print("Groq HTTP status:", response.status_code)

          if response.status_code != 200:
              print(response.text)
              raise SystemExit(
                  "Groq API authentication/request failed."
              )

          data = response.json()

          models = [
              item.get("id")
              for item in data.get("data", [])
          ]

          print(
              f"Groq returned {len(models)} available models."
          )

          if model not in models:
              print("")
              print("ERROR: Configured model is not available:")
              print(model)
              print("")
              print("Available models containing 'gpt-oss':")

              for model_id in models:
                  if "gpt-oss" in model_id:
                      print(" -", model_id)

              raise SystemExit(
                  "Configured GROQ_MODEL is not available."
              )

          print("")
          print("SUCCESS: Groq API and model are available.")
          print("Model:", model)
          PY


      # ===================================================
      # RUN PIB + GROQ
      # ===================================================

      - name: Run PIB + Groq pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: |
          python -m src.run_pipeline --batch 50
